/* src/css/base.css */
/* Cornsty - tokens, reset, stage */
:root{
  --ink:#26232b;--cream:#F8F2E0;--paper:#FBF8EE;--blue:#788CE3;--blue-d:#3E52CF;--navy:#2B3690;--red:#DE3F39;--pink:#F5A3C7;--teal:#2FB59B;--yellow:#FFD65C;--orange:#FF8A1E;
  --ui-top:64px;--ui-bottom:150px;
  --r:18px;--shadow:0 10px 30px rgba(38,35,43,.22);--font-d:"League Gothic",Impact,"Arial Narrow",sans-serif;--font-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--font-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:var(--font-b);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:fixed;inset:0;overflow:hidden;background:#BFCBF8}
.stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#8FA3F0,#BFCBF8 55%,#F3EEDF)}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;pointer-events:none}
.layer.main{pointer-events:auto}
.layer svg{display:block;overflow:visible}
#world{overflow:visible}
#pop{position:absolute;pointer-events:none}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:multiply;background-image:var(--grain,none);background-size:180px}
.stage{background:linear-gradient(#8FA3F0,#BFCBF8 40%,#F3EEDF 62%,#EBDAAE 80%)}

.wsvg{position:absolute;left:0;top:0;display:block;overflow:visible}
.wsvg-gull{pointer-events:none;will-change:transform}
.wsvg-front{pointer-events:none}
.wsvg-front *{pointer-events:auto}

/* src/css/scene.css */
/* Cornsty - scene animation & hover states */
.hot{cursor:pointer}
.hot .lift{transition:transform .28s var(--ease);transform-box:fill-box;transform-origin:50% 100%}
.hot:hover .lift,.hot:focus-visible .lift{transform:translateY(-12px) scale(1.04)}
.hot:focus-visible{outline:none}
#menu-board:hover rect:first-of-type{stroke:var(--blue-d)}
#surfboard{transition:transform .4s var(--ease);transform-box:fill-box}
#surfboard:hover{transform:translate(420px,1080px) rotate(-6deg)}
#basket.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:translate(1745px,866px) scale(1)}35%{transform:translate(1745px,858px) scale(1.08,.94)}100%{transform:translate(1745px,866px) scale(1)}}
.flag{animation:sway 3.6s steps(10,end) infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes sway{0%,100%{rotate:-5deg}50%{rotate:5deg}}
.bulb{animation:tw 2.4s steps(5,end) infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.55}}
.cloud{animation:drift 90s steps(180,end) infinite alternate}
.cloud.c1{animation-duration:120s}.cloud.c2{animation-duration:70s}
@keyframes drift{from{translate:-60px 0}to{translate:120px 0}}
.sun-spin{animation:spin 60s steps(120,end) infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{rotate:360deg}}
.sky-bird{animation:flap 2.6s steps(6,end) infinite;transform-box:fill-box;transform-origin:center}
.sky-bird.b1{animation-delay:-.9s}.sky-bird.b2{animation-delay:-1.7s}
@keyframes flap{0%,100%{translate:0 0;scale:1 1}50%{translate:14px -8px;scale:1 .6}}
.wave{animation:wv 6s steps(24,end) infinite alternate}
@keyframes wv{from{translate:-30px 0}to{translate:30px 4px}}
#m-glow{transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.flag,.bulb,.cloud,.sun-spin,.sky-bird,.wave{animation:none}}
.reduced .flag,.reduced .bulb,.reduced .cloud,.reduced .sun-spin,.reduced .sky-bird,.reduced .wave{animation:none}

/* src/css/ui.css */
/* Cornsty - interface: header, bubble, tray, spotlight, toasts, modals, buttons */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20;font-family:var(--font-b)}
#hud>*{pointer-events:auto}
.hud-hidden #hdr,.hud-hidden #tray,.hud-hidden #bubble{opacity:0;pointer-events:none}

/* ---------- header */
#hdr{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:12px;padding:10px 16px;pointer-events:none;z-index:2}
#hdr>*{pointer-events:auto}
.brand{height:42px;width:auto;flex:none;display:block;transition:transform .25s var(--ease)}
.brand:hover{transform:rotate(-3deg) scale(1.05)}
.brand svg{height:100%;width:auto;display:block;aspect-ratio:866/523;filter:drop-shadow(0 2px 0 rgba(38,35,43,.25))}
#tabs{margin-inline:auto;display:flex;gap:2px;padding:4px;background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink)}
.tab .art{font-style:normal}
.tab{padding:9px 16px;border-radius:999px;font:600 13px/1 var(--font-b);letter-spacing:.01em;white-space:nowrap;transition:background .2s,color .2s}
.tab:hover:not(.on){background:#fff}
.tab.on{background:var(--ink);color:var(--cream)}
.hdr-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
#tabs+.hdr-actions{margin-left:0}
.pill{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 10px;background:var(--cream);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s;position:relative}
.pill:hover{background:#fff}.pill:active,.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pill-t{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.pill-t b{font:400 20px/1 var(--font-d);letter-spacing:.03em;text-transform:uppercase}
.pill-t small{font:500 10px/1.1 var(--font-m);opacity:.7;letter-spacing:.02em;margin-top:2px}
.pill-i{display:grid;place-items:center}
#btn-cart.has{background:var(--red);color:var(--cream)}
#btn-cart.has:hover{background:#ea4f49}
#btn-cart.pop{animation:cartpop .5s var(--ease)}
@keyframes cartpop{0%{transform:scale(1)}30%{transform:scale(1.16) rotate(-4deg)}100%{transform:scale(1)}}
.club-q{width:28px;height:28px;display:block}
.club-q .stamp{width:100%;height:100%;display:block}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cream);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s}
.round:hover{background:#fff}.round.on{background:var(--blue)}

/* ---------- speech bubble */
#bubble{position:absolute;left:0;top:0;max-width:min(350px,calc(100vw - 24px));min-width:70px;padding:14px 18px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:22px;font:500 17px/1.4 var(--font-b);box-shadow:0 5px 0 var(--ink);--tail:40px;cursor:pointer;z-index:3}
#bubble b{font-weight:800}
#bubble::after{content:"";position:absolute;left:calc(var(--tail) - 11px);bottom:-13px;width:20px;height:20px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg);border-bottom-right-radius:6px}
#bubble.below::after{display:none}
#bubble.show{animation:bIn .3s var(--ease)}
#bubble.out{opacity:0;transition:opacity .25s}
@keyframes bIn{from{opacity:0;scale:.8;translate:0 10px}to{opacity:1;scale:1;translate:0 0}}
.b-text{white-space:pre-wrap;word-break:break-word}
.b-dots{display:flex;gap:6px;padding:6px 4px}
.b-dots i{width:10px;height:10px;border-radius:50%;background:var(--ink);animation:dot 1s ease-in-out infinite}
.b-dots i:nth-child(2){animation-delay:.15s}.b-dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
#echo{position:absolute;right:16px;bottom:calc(var(--ui-bottom) + 10px);max-width:min(300px,70vw);padding:10px 16px;background:var(--blue);color:var(--ink);border:3px solid var(--ink);border-radius:20px 20px 4px 20px;font:600 15px/1.35 var(--font-b);box-shadow:0 4px 0 var(--ink);z-index:3}
#echo.in{animation:eIn .3s var(--ease)}#echo.out{opacity:0;transition:opacity .35s}
@keyframes eIn{from{opacity:0;translate:20px 10px;scale:.9}to{opacity:1;translate:0 0;scale:1}}

/* ---------- tray (quick replies + input) */
#tray{position:absolute;left:0;right:0;bottom:0;padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none;z-index:4}
#tray>*{pointer-events:auto}
#chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:860px;min-height:0}
#chips.hidden{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 18px;background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);font:700 14px/1 var(--font-b);white-space:nowrap;animation:chipIn .35s var(--ease) both;transition:transform .12s,box-shadow .12s,background .15s}
.chip:hover{background:var(--blue)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip.red{background:var(--red);color:var(--cream)}.chip.red:hover{background:#ea4f49}
.chip.blue{background:var(--blue)}.chip.blue:hover{background:#8d9fea}
.chip-i{display:grid;place-items:center}
@keyframes chipIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
#say{display:flex;gap:8px;width:min(720px,100%)}
#say input{flex:1;min-width:0;height:52px;padding:0 22px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:500 16px var(--font-b);box-shadow:0 4px 0 var(--ink);outline:none}
#say input:focus{box-shadow:0 4px 0 var(--ink),0 0 0 4px rgba(120,140,227,.55)}
#say input::placeholder{color:rgba(38,35,43,.5)}
.go{width:52px;height:52px;flex:none;border-radius:50%;background:var(--red);color:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;transition:transform .12s,box-shadow .12s}
.go:hover{background:#ea4f49}.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* ---------- skip button */
#skip{position:absolute;right:16px;top:calc(var(--ui-top) + 10px);padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--cream);font:700 13px var(--font-b);border:2.5px solid var(--cream);animation:chipIn .3s both}

/* ---------- toasts */
#toasts{position:absolute;left:50%;bottom:calc(var(--ui-bottom) + 12px);transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:6;width:max-content;max-width:calc(100vw - 24px)}
.toast{display:flex;align-items:center;gap:10px;padding:11px 18px;background:var(--ink);color:var(--cream);border-radius:999px;font:600 14px/1.25 var(--font-b);box-shadow:var(--shadow);opacity:0;transform:translateY(12px) scale(.96);transition:opacity .3s,transform .35s var(--ease)}
.toast.in{opacity:1;transform:none}.toast.out{opacity:0;transform:translateY(-8px)}
.toast .toast-i{display:grid;place-items:center}
.toast.gain{background:var(--blue);color:var(--ink);border:2.5px solid var(--ink)}
.toast.good{background:var(--teal);color:var(--ink)}

/* ---------- product spotlight */
#spot{position:absolute;right:20px;top:calc(var(--ui-top) + 14px);width:340px;max-height:calc(100% - var(--ui-top) - var(--ui-bottom) - 28px);background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink),var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto;z-index:3;animation:spotIn .45s var(--ease)}
#spot.out{animation:spotOut .3s ease-in forwards}
@keyframes spotIn{from{opacity:0;transform:translateX(40px) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes spotOut{to{opacity:0;transform:translateX(40px)}}
.spot-x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;z-index:2}
.spot-art{position:relative;border-radius:16px;display:grid;place-items:center;padding:16px 10px;background:var(--tint,#DFE5FB);border:2.5px solid var(--ink);overflow:hidden}
.spot-art .swatch-bg{position:absolute;inset:0;opacity:.28}
#spot[data-id=trio] .pick-art svg{height:104px;width:auto;margin-inline:auto}
#spot[data-id=trio] .spot-art{padding:8px}#spot[data-id=trio] .spot-art .art-slot>svg{height:120px;width:auto}
.spot-art svg.pouch-svg,.spot-art>svg:not(.swatch-bg){position:relative;height:min(280px,32vh);width:auto;max-width:100%;filter:drop-shadow(0 8px 0 rgba(38,35,43,.22));transform:rotate(-2deg)}
.spot .spot-main{display:grid;gap:9px;min-width:0}
.spot h3{font:400 38px/.95 var(--font-d);letter-spacing:.02em;text-transform:uppercase;margin:0}
.eyebrow{font:500 11px/1.2 var(--font-m);letter-spacing:.09em;text-transform:uppercase;opacity:.65}
.spot p{margin:0;font-size:14px;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 11px/1 var(--font-m);letter-spacing:.05em;text-transform:uppercase;padding:6px 9px;border:2px solid var(--ink);border-radius:999px;background:#fff}
.spot-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font:400 36px/1 var(--font-d);letter-spacing:.02em}
.price s{font:500 14px var(--font-m);opacity:.5;margin-left:6px;white-space:nowrap}
.taste{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font:500 11px var(--font-m);letter-spacing:.05em;text-transform:uppercase;align-items:center}
.taste i{display:block;height:8px;border-radius:99px;background:rgba(38,35,43,.12);position:relative;overflow:hidden}
.taste i b{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:99px}

/* ---------- buttons, stepper, misc */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);font:700 15px/1 var(--font-b);box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .15s;text-align:center}
.btn:hover{background:#fff}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.red{background:var(--red);color:var(--cream)}.btn.red:hover{background:#ea4f49}
.btn.blue{background:var(--blue)}.btn.blue:hover{background:#8d9fea}
.btn.ink{background:var(--ink);color:var(--cream)}.btn.ink:hover{background:#3a3642}
.btn.ghost{box-shadow:none;background:transparent;border-color:rgba(38,35,43,.35)}
.btn.ghost:hover{background:rgba(255,255,255,.7)}
.btn.small{min-height:38px;padding:0 16px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.btn.big{min-height:58px;font-size:17px;padding:0 30px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.qty{display:inline-flex;align-items:center;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.qty button{width:38px;height:38px;font:700 20px/1 var(--font-b);display:grid;place-items:center}
.qty button:hover{background:var(--blue)}
.qty output{min-width:30px;text-align:center;font:700 16px var(--font-m)}
.hr{height:0;border-top:2.5px dashed rgba(38,35,43,.25);margin:4px 0}

/* ---------- modals */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;opacity:0;transition:opacity .28s;pointer-events:auto}
.modal.in{opacity:1}.modal.out{opacity:0}
.modal-bg{position:absolute;inset:0;background:rgba(38,35,43,.55);backdrop-filter:blur(3px)}
.modal-card{position:relative;width:min(580px,calc(100vw - 20px));max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);padding:26px;transform:translateY(24px) scale(.97);transition:transform .38s var(--ease);overscroll-behavior:contain}
.modal.in .modal-card{transform:none}
.modal-card.wide{width:min(1020px,calc(100vw - 20px))}
.modal-x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;z-index:5}
.modal-x:hover{background:var(--red);color:var(--cream)}
.modal h2{font:400 44px/.95 var(--font-d);letter-spacing:.02em;text-transform:uppercase;margin:0 40px 12px 0}
.modal h3{font:400 28px/1 var(--font-d);letter-spacing:.03em;text-transform:uppercase;margin:18px 0 8px}
.modal p{line-height:1.5;margin:0 0 10px}
.modal .menu-list{display:grid;gap:10px;margin-top:8px}
.modal .menu-list .btn{justify-content:flex-start}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:2px dashed rgba(38,35,43,.2)}
.switch{width:54px;height:30px;border-radius:99px;border:2.5px solid var(--ink);background:#fff;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .25s var(--ease)}
.switch[aria-checked=true]{background:var(--teal)}.switch[aria-checked=true]::after{transform:translateX(24px)}
body.has-modal #tray,body.has-modal #bubble{visibility:hidden}

/* ---------- responsive */
@media (max-width:980px){
  #tabs .tab{padding:9px 12px}
  .brand{height:36px}
}
@media (max-width:820px){
  :root{--ui-top:104px}
  #hdr{height:56px;padding:8px 10px;gap:8px}
  #tabs{position:absolute;left:10px;right:10px;top:58px;margin:0;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;padding:3px;box-shadow:0 2px 0 var(--ink)}
  #tabs::-webkit-scrollbar{display:none}
  .tab{flex:1;padding:8px 10px;font-size:12.5px}
  .hdr-actions{gap:6px;margin-left:auto}
  .pill{height:40px;padding:0 10px 0 8px;gap:6px}
  .pill-t b{font-size:18px}
  .round{width:40px;height:40px}
  #btn-sound{display:none}
  #spot{left:10px;right:10px;top:auto;width:auto;bottom:calc(var(--ui-bottom) + 2px);max-height:52vh;display:grid;grid-template-columns:92px 1fr;align-items:start;padding:10px;gap:4px 12px;border-radius:20px}
  .spot-x{width:30px;height:30px;right:6px;top:6px}
  .spot-art{padding:6px 4px;border-radius:12px}
  .spot-art svg.pouch-svg,.spot-art>svg:not(.swatch-bg),.spot-art .art-slot>svg{height:118px;width:100%;max-width:100%}
  .spot .spot-main{min-width:0;display:grid;gap:5px}
  .spot h3{font-size:28px;margin-right:30px}
  .spot p{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .spot .taste,.spot .tags,.spot .more{display:none}
  .spot .seg{gap:5px}.spot .seg button{min-width:36px;height:36px;padding:0 6px}
  #spot[data-id=trio]{grid-template-columns:1fr}#spot[data-id=trio] .spot-art{display:none}
  #spot[data-id=trio] .picks{grid-template-columns:repeat(6,1fr);gap:5px}
  #spot[data-id=trio] .pick{padding:3px 3px 2px;border-radius:9px;border-width:2px}
  #spot[data-id=trio] .pick-art svg{width:100%;height:auto}
  #spot[data-id=trio] .pick-n{right:1px;top:1px;font-size:10px;padding:1px 5px}
  #spot .hint{display:none}
  .price{white-space:nowrap}
  .spot .price{font-size:30px}
  .spot .btn.big{min-height:46px;font-size:14.5px;white-space:nowrap;padding-inline:10px}
  .price s{font-size:12px;margin-left:4px}
  #chips{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #chips::-webkit-scrollbar{display:none}
  #bubble{font-size:16px;padding:12px 15px}
  .modal-card{padding:20px 16px;border-radius:24px}
  .modal h2{font-size:38px}
}
@media (max-width:420px){
  .brand{height:32px}
  .pill-t small{display:none}
  .pill{height:38px}
  .tab{padding:8px 6px;font-size:12px}
  .tab .art{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.reduced *{animation-duration:.01ms!important;animation-iteration-count:1!important}

/* src/css/panels.css */
/* Cornsty - panels: intro, catalogue, checkout drawer, receipt, tracker, Club card, game */

/* ---------- intro */
#intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--cream);transition:opacity .7s ease,transform .8s var(--ease);overflow:hidden}
#intro.out{opacity:0;transform:scale(1.25);pointer-events:none}
.in-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#fff 0,var(--cream) 62%,#EFE6C9 100%)}
.in-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;text-align:center;max-width:100vw}
.in-icon{width:min(280px,54vw);height:auto;overflow:visible}
.in-bubble{position:absolute;top:2%;left:calc(50% + min(120px,22vw));width:170px;padding:12px 14px;background:#fff;border:3px solid var(--ink);border-radius:20px;font:500 15px/1.35 var(--font-b);text-align:left;box-shadow:0 4px 0 var(--ink)}
.in-bubble::after{content:"";position:absolute;left:18px;bottom:-12px;width:18px;height:18px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
.in-word{width:min(300px,62vw);height:auto;margin-top:4px;opacity:0;transition:opacity .3s}
.in-word.in{opacity:1}
.in-tag{margin:0;font:500 12px var(--font-m);letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .6s .1s}
.in-tag.in{opacity:.65}
.in-cta{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:16px;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s var(--ease)}
.in-cta.in{opacity:1;transform:none}
@media (max-width:520px){.in-bubble{left:50%;top:-4%;transform:translateX(-10%);width:150px}}

/* ---------- catalogue: options, picks, segments */
.opts{display:grid;gap:10px}
.opt-label{margin-top:2px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick{position:relative;border:2.5px solid var(--ink);border-radius:12px;background:#fff;padding:6px 6px 4px;transition:transform .15s,background .15s}
.pick:hover{background:var(--blue);transform:translateY(-2px)}
.pick.on{background:#E6EBFF;box-shadow:inset 0 0 0 2px var(--blue)}
.pick-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 0 rgba(38,35,43,.2))}
.pick-n{position:absolute;right:4px;top:4px;background:var(--ink);color:var(--cream);border-radius:99px;padding:2px 8px;font:700 12px var(--font-m)}
.picks-note{margin:0}
.picks-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.picks-foot .link{font:600 12px var(--font-b);text-decoration:underline;white-space:nowrap;padding:4px 2px}
.picks-foot [hidden]{display:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:44px;height:38px;padding:0 12px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;font:700 13px var(--font-b)}
.seg button.on{background:var(--ink);color:var(--cream)}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.35;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--red);flex:none;margin-top:1px}
.check small{opacity:.6}
.perso{display:grid;grid-template-columns:1fr 84px;gap:8px}
.perso[hidden]{display:none}
input[type=text],input[type=email],input[type=tel],input:not([type]),select{font:500 16px var(--font-b);color:var(--ink)}
.perso input,.f input,.promo input,.gift-note,select[data-s]{height:46px;padding:0 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;width:100%}
select[data-s]{width:auto;max-width:220px}
.jersey-both{display:flex;gap:4px;width:100%}
.jersey-both svg{width:50%;height:auto;filter:drop-shadow(0 6px 0 rgba(38,35,43,.2))}
.spot-art .jersey-both svg{height:auto;max-height:190px}
.spot-art .stack-svg,.spot-art .stickers-svg,.spot-art .cap-svg,.spot-art .plush-svg,.spot-art .tin-svg,.spot-art .giftbox-svg{height:auto;width:100%;max-height:220px}
.swatch-bg{position:absolute;inset:0;width:100%;height:100%;opacity:.28;pointer-events:none}
.swatch-bg svg,svg.swatch-bg{width:100%;height:100%;object-fit:cover}
.pm{display:grid;grid-template-columns:minmax(240px,1fr) 1.2fr;gap:24px}
.pm-art{position:relative;border:3px solid var(--ink);border-radius:20px;background:var(--tint,#DFE5FB);display:grid;place-items:center;padding:24px;overflow:hidden;align-self:start}
.pm-art svg.pouch-svg{position:relative;height:min(440px,52vh);width:auto;max-width:100%;filter:drop-shadow(0 10px 0 rgba(38,35,43,.22))}
.pm-art>svg:not(.swatch-bg):not(.pouch-svg),.pm-art .art-slot>svg:not(.pouch-svg){position:relative;width:100%;height:auto;max-height:420px}
.pm-main{display:grid;gap:10px;align-content:start}
@media (max-width:760px){.pm{grid-template-columns:1fr}.pm-art svg.pouch-svg{height:260px}}
.qc-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.qc-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border:2.5px solid var(--ink);border-radius:16px;background:#fff}
.qc-art svg{width:100%;height:auto;max-height:80px;display:block}
.qc-info{display:grid;gap:2px;font-size:14px}

/* ---------- checkout drawer */
.modal.drawer{place-items:stretch end}
.modal.drawer .modal-bg{background:rgba(38,35,43,.16);backdrop-filter:none}
.modal.drawer .modal-card{width:min(500px,100vw);height:100vh;height:100dvh;max-height:none;border-radius:28px 0 0 28px;border-right:0;margin:0;padding:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:-8px 0 0 var(--ink);transform:translateX(60px);transition:transform .45s var(--ease)}
.modal.drawer.in .modal-card{transform:none}
.modal.drawer .modal-x{top:16px;right:16px}
.modal.drawer .modal-body{display:flex;flex-direction:column;flex:1;min-height:0}
.dr{display:flex;flex-direction:column;flex:1;min-height:0}
.dr-head{padding:22px 66px 8px 22px}
.dr-head h2{margin:0}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:12px 0 4px;flex-wrap:wrap}
.steps li{font:600 12px var(--font-m);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;opacity:.5}
.steps li.on{background:var(--cream);opacity:1}
.steps li.cur{background:var(--ink);color:var(--cream)}
.dr-scroll{flex:1;overflow:auto;padding:6px 22px 18px;overscroll-behavior:contain}
.dr-foot{padding:14px 22px calc(16px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink);display:flex;gap:10px;align-items:center;justify-content:flex-end;background:var(--paper)}
.foot-total{margin-right:auto;display:grid;line-height:1}
.foot-total small{font:500 11px var(--font-m);letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.foot-total b{font:400 38px var(--font-d);letter-spacing:.02em}
.dr-empty{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;padding:24px}
.dr-gull .icon-gull{width:150px;height:auto;filter:drop-shadow(0 6px 0 rgba(38,35,43,.2))}
.icon-gull.bounce{animation:hopy 0.9s var(--ease) infinite}
@keyframes hopy{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-16px) scale(.98,1.04)}}
.lines{list-style:none;margin:0;padding:0}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:2.5px dashed rgba(38,35,43,.22)}
.l-art svg{width:100%;height:auto;max-height:84px;display:block;filter:drop-shadow(0 3px 0 rgba(38,35,43,.18))}
.l-info{display:grid;gap:4px;min-width:0}
.l-info b{font:400 26px/1 var(--font-d);letter-spacing:.03em;text-transform:uppercase}
.l-price{display:grid;justify-items:end;gap:8px;font:600 15px var(--font-m)}
.l-x{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:#fff}
.l-x:hover{background:var(--red);color:var(--cream)}
.upsell{margin:14px 0;padding:12px;border:2.5px solid var(--ink);border-radius:16px;background:#EEF1FF;display:grid;gap:8px}
.up{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}
.up-art svg{width:100%;height:auto;max-height:60px}
.up-t{display:grid;font-size:13px;line-height:1.3}
.meter{margin:14px 0}
.meter-t{font-size:13px;margin-bottom:6px}
.meter-bar{height:14px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.meter-bar i{display:block;height:100%;background:var(--blue);border-right:2.5px solid var(--ink);transition:width .7s var(--ease)}
.meter.done .meter-bar i{background:var(--teal);border-right:0}
.box{margin:14px 0;display:grid;gap:8px}
.promo{display:flex;gap:8px}
.promo-msg{margin:0;font-size:13px}
.promo-msg.ok{color:#127a64;font-weight:600}.promo-msg.bad{color:var(--red);font-weight:600}
.vouch{display:grid;gap:6px}
.vou{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer}
.vou.on{background:#FFE9A6}
.vou input{accent-color:var(--red)}
.vou small{display:block;opacity:.7}
.opts2{gap:10px}
.totals{margin:14px 0 6px;display:grid;gap:6px}
.totals>div{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.totals dt,.totals dd{margin:0}
.totals .disc dd{color:#127a64;font-weight:700}
.totals .grand{border-top:3px solid var(--ink);padding-top:10px;margin-top:4px;font:400 34px/1 var(--font-d);letter-spacing:.03em;text-transform:uppercase}
.totals .vat{font:400 11px var(--font-m);opacity:.6}
.earn{margin-top:14px;padding:14px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;display:grid;gap:8px}
.earn-t{font-size:14px}
.earn-s{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.es svg{width:100%;height:auto;display:block}
.es.have{opacity:.9}.es.new svg{animation:newst 1.4s ease-in-out infinite}
@keyframes newst{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.form .f{display:grid;gap:4px;margin-bottom:12px}
.form label{font:600 12px var(--font-m);letter-spacing:.06em;text-transform:uppercase}
.form label small{text-transform:none;letter-spacing:0;font:400 12px var(--font-b);opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3 .f:last-child{grid-column:1/-1}
.ships{display:grid;gap:8px;margin:6px 0 16px}
.ship{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;text-transform:none;letter-spacing:0}
.ship.on{background:#FFE9A6}
.ship input{accent-color:var(--red)}
.ship b{font:700 14px var(--font-b)}.ship small{display:block;font:400 12px var(--font-b);opacity:.7}
.ship i{font:600 13px var(--font-m);font-style:normal}
.pickup{padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#EEF1FF}
.err{margin:6px 0 10px;padding:10px 12px;border:2.5px solid var(--red);border-radius:12px;background:#FFECEB;color:#8e1c17;font-weight:600;font-size:14px}
.recap{display:grid;gap:2px;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;margin:6px 0 12px;font-size:14px;position:relative}
.recap .link{position:absolute;right:12px;top:12px}
.link{font:600 13px var(--font-b);text-decoration:underline;text-underline-offset:3px}
.demo{margin:0 0 12px;padding:10px 12px;border:2.5px dashed var(--ink);border-radius:12px;background:#FFF6D6;font-size:13px;line-height:1.4}
.demo.ok{background:#E3F7F1}
code{font:500 12px var(--font-m);background:rgba(38,35,43,.08);padding:2px 5px;border-radius:5px}
.btn.loading{pointer-events:none;opacity:.8}
.btn.loading::after{content:"";width:16px;height:16px;border-radius:50%;border:3px solid var(--cream);border-top-color:transparent;animation:spin2 .7s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.modal.drawer.peek .modal-card{transform:translateX(105%)}
.done-l{font-size:15px;line-height:1.5;margin:4px 0 8px}
.gain{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px 14px;border:2.5px solid var(--ink);border-radius:16px;background:#E6EBFF;margin:14px 0}
.gain-i svg{width:100%;height:auto;animation:hopy 1.2s var(--ease) 2}
.hot-t{color:var(--red)}
.newbadges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.nb{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;animation:chipIn .5s var(--ease) both}
.nb svg{width:44px;height:44px}.nb span{display:grid;line-height:1.1;font-size:13px}
.done-cta{display:grid;gap:10px;margin:18px 0 6px}
.track{list-style:none;margin:14px 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative}
.track li{display:grid;justify-items:center;gap:6px;font:500 10px/1.2 var(--font-m);text-align:center;text-transform:uppercase;letter-spacing:.03em;position:relative;opacity:.5}
.track li i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:#fff;position:relative;z-index:1}
.track li::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:3px;background:var(--ink);opacity:.25}
.track li:first-child::before{display:none}
.track li.done,.track li.cur{opacity:1}
.track li.done i{background:var(--teal)}.track li.cur i{background:var(--yellow);animation:newst 1.2s infinite}
.track li.done::before,.track li.cur::before{opacity:1;background:var(--teal)}

/* ---------- receipt */
.receipt{position:relative;background:#fff;color:var(--ink);font:400 12px/1.5 var(--font-m);padding:22px 20px 28px;margin:22px auto 12px;width:100%;max-width:360px;box-shadow:0 8px 0 rgba(38,35,43,.12),0 12px 30px rgba(38,35,43,.15);filter:drop-shadow(0 1px 0 rgba(38,35,43,.15))}
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:9px}
.receipt::before{top:-8px;background:conic-gradient(from -45deg at bottom,#0000,#fff 1deg 89deg,#0000 90deg) 0 0/14px 9px}
.receipt::after{bottom:-8px;background:conic-gradient(from 135deg at top,#0000,#fff 1deg 89deg,#0000 90deg) 0 0/14px 9px}
.rc-top{display:flex;align-items:flex-end;gap:10px;padding-bottom:10px}
.rc-icon{width:54px;height:auto}.rc-word{width:112px;height:auto;opacity:.9}
.rc-meta{display:flex;justify-content:space-between;font-size:11px;opacity:.7;border-bottom:2px dotted rgba(38,35,43,.4);padding-bottom:8px}
.rc-cols{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;opacity:.55;padding:8px 0 2px}
.rc-cols span:nth-child(2){margin-left:auto;margin-right:26px}
.rc-line{display:grid;grid-template-columns:22px 1fr 24px 62px;gap:6px;padding:6px 0;border-bottom:1px dotted rgba(38,35,43,.3);align-items:start}
.rc-n{opacity:.4}.rc-name{display:grid}.rc-name small{opacity:.6;font-size:10px;line-height:1.35}.rc-q{text-align:right}.rc-p{text-align:right;font-weight:500}
.rc-hr{border-top:2px dashed rgba(38,35,43,.4);margin:10px 0 6px}
.rc-row{display:flex;justify-content:space-between;padding:2px 0}
.rc-row.disc span:last-child{color:#127a64}
.rc-row.small{font-size:10px;opacity:.6}
.rc-total{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0;padding:8px 0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font:500 20px var(--font-m)}
.barcode{display:block;width:100%;height:44px;margin:14px 0 8px}
.rc-foot{display:grid;gap:1px;text-align:center;font-size:10px;opacity:.75}
.rc-tag{margin-top:6px;font-family:var(--font-d);font-size:16px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}

/* ---------- Club */
.club-modal .modal-card{padding:26px}
.club{display:grid;grid-template-columns:minmax(290px,380px) 1fr;gap:26px;align-items:start}
.club-l{display:grid;gap:14px}
.ccard{position:relative;width:100%;aspect-ratio:1.586;perspective:1200px;transform-style:preserve-3d;transition:transform .8s var(--ease);cursor:pointer}
.ccard.flipped{transform:rotateY(180deg)}
.cc-face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);box-shadow:0 8px 0 var(--ink);overflow:hidden}
.cc-back{background:#F4F6FF;padding:12px 14px 10px;display:flex;flex-direction:column;gap:6px}
.cc-front{transform:rotateY(180deg);background:#8A9BEF}
.cc-check{position:absolute;inset:0;background:conic-gradient(#6A7EE0 25%,#8A9BEF 0 50%,#6A7EE0 0 75%,#8A9BEF 0) 0 0/44px 44px}
.cc-word{position:absolute;left:12%;top:14%;width:76%;height:auto;filter:drop-shadow(0 4px 0 rgba(38,35,43,.25))}
.cc-pill{position:absolute;right:14px;bottom:14px;padding:6px 14px;background:var(--pink);border:2.5px solid var(--ink);border-radius:999px;font:700 12px var(--font-b);transform:rotate(-6deg)}
.cc-name{position:absolute;left:16px;bottom:16px;font:600 12px var(--font-m);letter-spacing:.1em;color:var(--cream);text-shadow:0 2px 0 var(--ink)}
.cc-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cc-title{font:400 30px/1 var(--font-d);color:var(--blue);letter-spacing:.03em}
.cc-q{width:20px;height:20px;flex:none;display:block}.cc-q svg{width:100%;height:100%}
.cc-sub{margin-left:auto;font:800 9.5px/1.25 var(--font-b);letter-spacing:.02em;text-align:right;color:var(--ink)}
.cc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 8px;flex:1;align-content:center}
.slot{display:block;line-height:0}
.slot svg{width:100%;height:auto;display:block}
.slot.hit svg{animation:stampHit .55s var(--ease)}
@keyframes stampHit{0%{transform:scale(2.2) rotate(-14deg);opacity:0}55%{transform:scale(.9);opacity:1}100%{transform:none}}
.cc-foot{display:flex;justify-content:space-between;font:600 9.5px var(--font-m);letter-spacing:.08em;color:var(--ink);opacity:.7}
.club-actions{display:flex;gap:10px;flex-wrap:wrap}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(222,63,57,.5)}50%{box-shadow:0 4px 0 var(--ink),0 0 0 10px rgba(222,63,57,0)}}
.tier{display:grid;gap:8px;padding:14px;border:3px solid var(--ink);border-radius:18px;background:#fff}
.tier-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tier-n{font:400 40px/1 var(--font-d);letter-spacing:.03em;text-transform:uppercase;color:var(--blue-d)}
.tier .meter{margin:0}
.perks{margin:0;padding-left:18px;font-size:14px;line-height:1.5}
.vlist{display:grid;gap:6px}
.vchip{display:inline-block;padding:8px 12px;border:2.5px solid var(--ink);border-radius:999px;background:#FFE9A6;font:600 13px var(--font-b);width:fit-content}
.club-r{min-width:0}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 44px 12px 0}
.ctabs button{padding:9px 16px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;font:700 13px var(--font-b)}
.ctabs button.on{background:var(--ink);color:var(--cream)}
.ctab h3:first-child{margin-top:4px}
.how{padding-left:20px;line-height:1.55;font-size:14.5px}.how li{margin-bottom:6px}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.sd{display:grid;justify-items:center;gap:2px;padding:8px 2px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;opacity:.55;font:600 11px var(--font-m)}
.sd i{display:block;width:100%;max-width:34px;line-height:0;filter:grayscale(1);opacity:.5}
.sd i svg{width:100%;height:auto}
.sd.on{opacity:1;background:#FFE9A6}.sd.on i{filter:none;opacity:1}
.sd small{opacity:.7}
.rew{display:grid;gap:10px;margin-top:8px}
.rw{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px;border:2.5px solid var(--ink);border-radius:16px;background:#fff}
.rw.can{background:#E6EBFF}
.rw-i svg{width:100%;height:auto;max-height:64px}
.rw-n{display:grid;place-items:center;height:60px;background:var(--red);color:var(--cream);border:2.5px solid var(--ink);border-radius:12px;font:400 26px var(--font-d)}
.rw-t{display:grid;gap:2px;font-size:14px}.rw-t span{opacity:.7;font-size:13px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.bd{display:grid;justify-items:center;text-align:center;gap:2px;padding:10px 6px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;font-size:13px;opacity:.6}
.bd.on{opacity:1;background:#E6EBFF}
.bd svg{width:64px;height:64px}
.bd small{font-size:11px;opacity:.7;line-height:1.25}
.tried{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tr{opacity:.28;filter:grayscale(1)}.tr.on{opacity:1;filter:none}.tr svg{width:100%;height:auto;display:block}
.orders,.plog{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.orders li{padding:12px 14px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;display:grid;gap:8px;font-size:14px}
.o-h{display:flex;justify-content:space-between;gap:8px}.o-l{opacity:.8}.o-s{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plog li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:2px dashed rgba(38,35,43,.2);font-size:14px}
.plog b{font-family:var(--font-m)}.plog b.neg{color:var(--red)}
.refcode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.refcode output{font:400 40px/1 var(--font-d);letter-spacing:.08em;padding:6px 16px;border:3px dashed var(--ink);border-radius:14px;background:#fff}
@media (max-width:860px){.club{grid-template-columns:1fr}.tried{grid-template-columns:repeat(3,1fr)}}

/* ---------- grain of the day, stamp ceremony */
.grain-modal .modal-card{width:min(440px,calc(100vw - 20px));text-align:center}
.grain-modal h2{margin-right:0}
.g-l{opacity:.85}
.pan svg{width:min(320px,80%);height:auto}
.g-s{margin:6px 0}
.g-pts{font:400 64px/1 var(--font-d);color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink);animation:gpts .7s var(--ease)}
@keyframes gpts{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.stamp-modal .modal-card{width:min(480px,calc(100vw - 20px));text-align:center}
.stamp-modal h2{margin-right:0}
.stamp-host{max-width:400px;margin:8px auto 4px}
.stamp-tool-wrap{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.stamp-tool-wrap svg{position:absolute;left:0;top:0;opacity:0;filter:drop-shadow(0 6px 0 rgba(38,35,43,.25))}
.modal.overlay-top{z-index:120}

/* ---------- game */
.game-modal .modal-card{width:min(520px,calc(100vw - 16px));padding:14px;text-align:center}
.game-modal h2{font-size:34px;margin:4px 40px 6px 0;text-align:left}
.game-wrap{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:linear-gradient(#8FA3F0,#BFCBF8);touch-action:none;user-select:none}
.game-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:3/4}
.game-hud{display:flex;justify-content:space-between;gap:10px;padding:8px 4px 0;font:600 14px var(--font-m)}
.game-over{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;background:rgba(248,242,224,.94);padding:20px}
.game-over[hidden]{display:none}
.game-over .big{font:400 72px/1 var(--font-d);color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}

/* ---------- misc: faq, modal lists */
details{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:0 14px;margin-bottom:8px}
details summary{cursor:pointer;padding:12px 0;font:700 15px var(--font-b);list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";font:700 20px var(--font-m)}
details[open] summary::after{content:"−"}
details p{margin:0 0 12px}
.bumped{animation:bumpk .5s var(--ease)}
@keyframes bumpk{0%{transform:scale(1)}35%{transform:scale(1.14) rotate(-3deg)}100%{transform:scale(1)}}
select{border:2.5px solid var(--ink);border-radius:12px;background:#fff;height:42px;padding:0 10px}

@media print{
  body>*:not(#hud):not(.modal){display:none!important}
  #hud>*:not(#modal-host){display:none!important}
  .modal{position:static!important;background:#fff}
  .modal-bg,.modal-x,.done-cta,.dr-head,.steps{display:none!important}
  .modal.drawer .modal-card{box-shadow:none;border:0;height:auto;width:auto}
  .dr-scroll{overflow:visible}
}
</style>

<div id="app"></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#F8F2E0;font:16px Inter,sans-serif">Le kiosque Cornsty a besoin de JavaScript pour ouvrir. Écris-nous à salut@cornsty.fr pour commander.</p></noscript>
<script>/* src/js/00-core.js */
/* Cornsty - core helpers: DOM, easing, ticker, cancellable scripts, event bus.

    linear: (t) => t,
    inQuad: (t) => t * t,

/* Cornsty - drawing kit (1/2): palette, brand patterns, quatrefoil, wordmark, icon, oval badges, popcorn.
   All artwork is generated as SVG markup strings. Brand pieces (mascot, icon, wordmark, quatrefoil) come from the REAL vectors

  D.parts = (parts, cls) => parts.map((p) => `<path class="r-${p.role}${cls ? ' ' + cls : ''}" d="${p.d}"/>`).join('');
  D.quatPath = () => A.quat.d;                                 // 301 x 301
  D.quat = (fill, size = 301, x = 0, y = 0) => `<path transform="translate(${x} ${y}) scale(${f(size / 301)})" d="${A.quat.d}" fill="${fill}"/>`;
  D.wordmark = (fill = K.cream, mark = K.ink, extra = '') => `<g>${A.wordmark.letters.map((p) => `<path d="${p.d}" fill="${fill}" ${extra}/>`).join('')}<path d="${A.wordmark.mark.d}" fill="${mark}"/></g>`; // 866 x 523

  D.patterns = {
    // diamonds 116 x 201 (60deg), two colours alternate
    harlequin(c, w, h, s = 1) {

    },
    // orange right triangles on a red ground, diagonal continues across rows
    triangles(c, w, h, s = 1) {

    },

    zigzag(c, w, h, s = 1) {

      case 'checker': return { a: '#7888E8', b: '#3858A8' };

      joined: false, points: 0, lifetime: 0, stamps: 0, cards: 0,

      { id: 'big', name: 'Gros appétit', desc: 'Une commande de 40 € ou plus', pts: 10, glyph: '€' },
      { id: 'owl', name: 'Noctambule', desc: 'Commander entre 22 h et 5 h', pts: 5, glyph: '☾' },
      { id: 'streak7', name: 'Sur la lancée', desc: '7 jours de suite au kiosque', pts: 15, glyph: '7' },
      { id: 'arcade', name: 'As du pop', desc: '40 points à Attrape-Pop', pts: 10, glyph: '!' },
      { id: 'merch', name: 'Fan-club', desc: 'Tu portes les couleurs', pts: 10, glyph: '◆' },

      st.last = today;

  /* ============================================================ quote (all the price maths, one place) */
  const eligibleVoucher = (v, lines, sub) => {

    if (v.kind === 'off5') return sub >= 15 ? { amount: 5, label: v.label } : { need: 15 - sub, label: v.label };
    if (v.kind === 'pouch' || v.kind === 'stamp') return pouches.length ? { amount: pouches[0].unit, label: v.label } : { need: 'pouch', label: v.label };

(function (C) {

<h2>Le kiosque</h2>
<div class="menu-list">
  <button class="btn" data-a="quick">📋 Catalogue rapide (sans animation)</button>

  <button class="btn" data-a="about">🐦 À propos de Cornsty</button>
</div>
<h3>Réglages</h3>
<div class="setting"><span><b>Son</b><br><small>Bruitages du kiosque et voix de la Mouette</small></span><button class="switch" role="switch" aria-checked="${C.audio.on}" data-s="sound" aria-label="Son"></button></div>
<div class="setting"><span><b>Ambiance mer</b><br><small>Vagues très discrètes (avec le son)</small></span><button class="switch" role="switch" aria-checked="${p.sea !== false}" data-s="sea" aria-label="Ambiance mer"></button></div>

<div class="setting"><span><b>Réduire les animations</b><br><small>Caméra, parallaxe et confettis atténués</small></span><button class="switch" role="switch" aria-checked="${U.reduced()}" data-s="motion" aria-label="Réduire les animations"></button></div>

    const el = m.el;
