<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#221e1f">
<title>Menu animé</title>
<!--
  Menu animé : Chat / Questions / Articles / Communities.
  Fichier autonome, sans dépendance : il s'ouvre directement dans un navigateur.

  - Police : Stack Sans Headline, poids 400. © 2025 The Stack Sans Project Authors
    (https://github.com/DylanYoungKoto/Stack-Sans), licence SIL OFL 1.1 (https://openfontlicense.org).
    Sous-ensemble latin de Google Fonts, embarqué en base64 en bas du <head>.
  - Dimensions : 1 unité = 1 px de la maquette 1200 × 1500, mise à l'échelle par --k.
  - Un faux curseur rejoue la démo en boucle. Dès que la vraie souris bouge (ou qu'on tape / tabule),
    on reprend la main ; la démo repart après quelques secondes d'inactivité.
-->
<script>document.documentElement.classList.add('js')</script>
<style>
  /* Propriétés typées : permettent d'animer le "wipe" (--p) et le cercle (--r) avec de vraies transitions. */
  @property --p { syntax: "<percentage>"; inherits: false; initial-value: -1%; }
  @property --r { syntax: "<length>"; inherits: false; initial-value: -1px; }

  :root {
    --k: min(calc(88vw / 585), calc(58svh / 480), 1.35px); /* px écran par px de maquette */
    --bg: #221e1f;
    --paper: #ededed;
    --ink: #000;
    --out: cubic-bezier(.16, 1, .3, 1);      /* expo out */
    --spring: cubic-bezier(.34, 1.56, .64, 1); /* léger dépassement */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { overflow: hidden; -webkit-user-select: none; user-select: none; }
  .stage { min-height: 100svh; display: grid; place-items: center; }

  /* ---------- Menu ---------- */
  .menu { display: grid; justify-items: start; gap: calc(20 * var(--k)); }

  .item {
    --delay: calc(150ms + var(--i) * 100ms);
    display: flex;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    transform-origin: 0 50%;
    transition: transform .18s var(--out);
    -webkit-tap-highlight-color: transparent;
  }
  .item:focus-visible { outline: calc(3 * var(--k)) solid #fff; outline-offset: calc(6 * var(--k)); }
  .item.is-pressed, .item:active { transform: scale(.975); }

  /* --c : couleur vive · --d : ton foncé · --on : couleur du texte quand l'entrée est active */
  .item:nth-child(1) { --c: #ff5f00; --d: #6e1526; --on: #fff; }
  .item:nth-child(2) { --c: #f39fff; --d: #6e1526; --on: var(--d); }
  .item:nth-child(3) { --c: #ffcc00; --d: #413100; --on: var(--d); }
  .item:nth-child(4) { --c: #85af25; --d: #263703; --on: var(--d); }

  /* Pastille : fond vif + point foncé. Actif : un disque foncé grandit depuis le point, qui devient vif. */
  .icon {
    --r: -1px;
    position: relative; /* au-dessus du libellé, qui passe 1px dessous : pas de liseré entre les deux */
    z-index: 1;
    flex: none;
    display: grid;
    place-items: center;
    width: calc(105 * var(--k));
    height: calc(105 * var(--k));
    background: radial-gradient(circle at 50% 50%, var(--d) calc(var(--r) - .5px), var(--c) calc(var(--r) + .5px));
    transition: --r .45s var(--out);
  }
  .dot { width: calc(38.8 * var(--k)); height: calc(38.8 * var(--k)); }
  .dot::before {
    content: "";
    display: block;
    height: 100%;
    border-radius: 50%;
    background: var(--d);
    transition: background-color 0s .1s;
  }

  /* Libellé : un seul élément, deux couches de fond. La couche 1 (clippée sur le texte) et la couche 2
     (fond de la boîte) partagent --p, donc la couleur du texte bascule exactement sur le front du "wipe". */
  .label {
    --p: -1%;
    display: flex;
    align-items: center;
    height: calc(105 * var(--k));
    margin-left: -1px;
    padding: calc(3.8 * var(--k)) calc(35.5 * var(--k)) 0 calc(28 * var(--k) + 1px);
    font: 400 calc(67.2 * var(--k)) / 1 "Stack Sans Headline", "Helvetica Neue", Arial, sans-serif;
    white-space: nowrap;
    color: transparent;
    background:
      linear-gradient(90deg, var(--on) var(--p), var(--ink) var(--p)),
      linear-gradient(90deg, var(--c) var(--p), var(--paper) var(--p));
    -webkit-background-clip: text, border-box;
    background-clip: text, border-box;
    transition: --p .45s var(--out);
  }

  @supports not ((background-clip: text) or (-webkit-background-clip: text)) {
    .label { color: var(--ink); background: linear-gradient(90deg, var(--c) var(--p), var(--paper) var(--p)); }
    .item.is-active .label { color: var(--on); }
  }

  /* ---------- État actif (survol, focus clavier ou faux curseur) ---------- */
  .item.is-active .icon { --r: calc(85 * var(--k)); transition-duration: .6s; }
  .item.is-active .dot { animation: dot-pop .55s var(--out); }
  .item.is-active .dot::before { background: var(--c); }
  .item.is-active .label { --p: 101%; transition-duration: .55s; }

  @keyframes dot-pop { 40% { transform: scale(1.32); } }

  /* ---------- Intro ---------- */
  html.js:not(.is-ready) .item { visibility: hidden; animation: unhide 0s 3s forwards; } /* filet de sécurité si le JS échoue */
  @keyframes unhide { to { visibility: visible; } }
  .is-ready .icon { animation: icon-in .8s var(--spring) var(--delay) backwards; }
  .is-ready .label { animation: wipe-in .9s var(--out) calc(var(--delay) + .14s) backwards; }
  .is-ready .dot::before { animation: dot-in .6s var(--spring) calc(var(--delay) + .28s) backwards; }

  @keyframes icon-in { from { transform: scale(.35) rotate(-10deg); opacity: 0; } }
  @keyframes wipe-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes dot-in  { from { transform: scale(0); } }

  /* ---------- Faux curseur (la pointe est à l'origine de l'élément) ---------- */
  .cursor {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s;
    will-change: transform;
  }
  .cursor.is-on { opacity: 1; }
  .cursor svg {
    display: block;
    overflow: visible;
    width: calc(56 * var(--k));
    height: calc(90 * var(--k));
    margin: calc(-6 * var(--k)) 0 0 calc(-6 * var(--k));
    transform-origin: calc(6 * var(--k)) calc(6 * var(--k));
    filter: drop-shadow(calc(1.5 * var(--k)) calc(2 * var(--k)) calc(3 * var(--k)) rgb(0 0 0 / .22));
    transition: transform .12s var(--out);
  }
  .cursor.is-down svg { transform: scale(.88); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .cursor { display: none; }
  }
</style>

  const items = [...menu.children];
  const cursor = document.querySelector('.cursor');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const pos = { x: 0, y: 0 }; // pointe du curseur (faux ou vrai)
  let mode = 'boot';          // boot -> auto (démo) <-> manual (souris / clavier / doigt)
  let run = 0;                // id de la démo en cours : l'incrémenter l'annule
  let idle = 0;
  let seen = null;            // dernière position réelle de la souris (pour ignorer les faux mouvements)
  let placed = false;         // le curseur a-t-il déjà une position ?

  const rnd = (a, b) => a + Math.random() * (b - a);
  const ease = (t) => (t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2);
  const wait = (ms, id) => new Promise((ok) => setTimeout(() => ok(id === run), ms));

  const place = (x, y) => {
    pos.x = x; pos.y = y; placed = true;
    cursor.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  };
  const setActive = (el) => items.forEach((it) => it.classList.toggle('is-active', it === el));
  const hover = () => setActive(items.find((it) => {
    const r = it.getBoundingClientRect();
    return pos.x >= r.left && pos.x <= r.right && pos.y >= r.top && pos.y <= r.bottom;
  }));
  const spot = (it, fx, fy) => {
    const r = it.querySelector('.label').getBoundingClientRect();
    return { x: r.left + r.width * fx, y: r.top + r.height * fy };
  };
  const press = (it) => {
    cursor.classList.add('is-down');
    it.classList.add('is-pressed');
    setTimeout(() => { cursor.classList.remove('is-down'); it.classList.remove('is-pressed'); }, 140);
  };

  // Déplace la pointe le long d'une courbe de Bézier ; l'entrée sous la pointe s'active en route.
  const tween = (to, id, bow = .1) => new Promise((done) => {
    const from = { ...pos };
    const dx = to.x - from.x, dy = to.y - from.y, len = Math.hypot(dx, dy) || 1;
    const ms = Math.min(1300, Math.max(600, 420 + len * .9));
    const nx = -dy * bow, ny = dx * bow;
    const c1 = { x: from.x + dx * .3 + nx, y: from.y + dy * .3 + ny };
    const c2 = { x: from.x + dx * .75 + nx * .3, y: from.y + dy * .75 + ny * .3 };
    const t0 = performance.now();
    const frame = (now) => {
      if (id !== run) return done(false);
      const t = Math.min(1, (now - t0) / ms), e = ease(t), u = 1 - e;
      const [a, b, c, d] = [u * u * u, 3 * u * u * e, 3 * u * e * e, e * e * e];
      place(a * from.x + b * c1.x + c * c2.x + d * to.x, a * from.y + b * c1.y + c * c2.y + d * to.y);
      hover();
      if (t < 1) requestAnimationFrame(frame); else done(true);
    };
    requestAnimationFrame(frame);
  });

  const away = () => { // en haut à droite du menu, hors des entrées
    const r = menu.getBoundingClientRect();
    return { x: Math.min(innerWidth - 20, r.right + r.width * .1), y: Math.max(20, r.top - r.height * .1) };
  };

  async function demo(id) {
    if (!placed) { const a = away(); place(a.x, a.y); }
    cursor.classList.add('is-on');
    for (;;) {
      for (const [n, it] of items.entries()) {
        // 1re entrée : position exacte de la maquette (pointe à 84,5 % / 81 % du libellé "Chat")
        const to = n ? spot(it, rnd(.45, .85), rnd(.4, .85)) : spot(it, .845, .81);
        if (!await tween(to, id)) return;
        if (!await wait(650, id)) return;
        press(it);
        if (!await wait(750, id)) return;
      }
      if (!await tween(away(), id, .14)) return;
      if (!await wait(600, id)) return;
    }
  }

  function auto() {
    mode = 'auto';
    setActive(null);
    demo(++run);
  }
  // La vraie souris / le clavier / un doigt reprend la main. La démo repart après `ms` d'inactivité,
  // mais pas tant qu'une entrée reste survolée ou focalisée (`hold`) : un doigt, lui, n'a pas de survol.
  function takeOver(ms, hold) {
    run++;
    mode = 'manual';
    cursor.classList.remove('is-on', 'is-down');
    items.forEach((it) => it.classList.remove('is-pressed'));
    clearTimeout(idle);
    const wake = () => { idle = setTimeout(() => (hold && menu.querySelector('.is-active') ? wake() : auto()), ms); };
    if (!still) wake();
  }

  // Souris, stylet, doigt
  const onPoint = (e) => {
    if (e.type === 'pointermove' && e.pointerType !== 'touch') {
      const prev = seen; seen = { x: e.clientX, y: e.clientY };
      if (!prev || Math.hypot(seen.x - prev.x, seen.y - prev.y) < 3) return; // ignore les faux mouvements
    } else seen = { x: e.clientX, y: e.clientY };
    const touch = e.pointerType === 'touch';
    takeOver(touch ? 3500 : 5000, !touch);
    place(e.clientX, e.clientY);
    hover();
  };
  addEventListener('pointermove', onPoint);
  addEventListener('pointerdown', onPoint);
  html.addEventListener('pointerleave', (e) => {
    if (e.pointerType === 'mouse') { setActive(null); takeOver(1200, false); }
  });

  // Clavier
  menu.addEventListener('focusin', (e) => {
    const it = e.target.closest('.item');
    if (it && it.matches(':focus-visible')) { takeOver(6000, true); setActive(it); }
  });
  menu.addEventListener('focusout', () => setActive(null));
  menu.addEventListener('click', (e) => e.preventDefault());

  // Démarrage : on attend la police, puis l'intro CSS, puis la démo
  const fontReady = Promise.race([
    Promise.allSettled([document.fonts.load('400 1em "Stack Sans Headline"'), document.fonts.ready]),
    new Promise((ok) => setTimeout(ok, 2000)),
  ]);
  fontReady.then(() => requestAnimationFrame(() => {
    html.classList.add('is-ready');
    if (!still) setTimeout(() => { if (mode === 'boot') auto(); }, 1500);
  }));
})();
</script>
</body>
</html>
