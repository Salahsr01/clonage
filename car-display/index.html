<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#efefef">
<title>Car display</title>
<!--
  Écran de voiture (« Welcome ») posé sur son tableau de bord, avec ses animations.
  Fichier autonome, sans dépendance : il s'ouvre directement dans un navigateur.

  - Scène : 1 unité = 1 px de la maquette 1080 × 1080, mise à l'échelle par --k. Le boîtier (trapèze en
    perspective, face supérieure visible), l'écran, l'éclair et la voiture vue de dessus sont des tracés SVG
    relevés sur la maquette ; le tableau de bord déborde de chaque côté pour remplir toute la fenêtre.
  - Police : Arimo 400-700 (© 2020 The Arimo Project Authors, licence SIL OFL 1.1, https://openfontlicense.org),
    sous-ensemble latin de Google Fonts embarqué en base64 en bas du <head>. Métriques proches d'Helvetica.
  - Animations : montée du boîtier, allumage de l'écran (balayage), barre de batterie et compteurs, lettres du
    titre, pastilles. Le sélecteur P R N D est utilisable (clic, tactile, flèches du clavier) ; une démo change de
    rapport en boucle et s'arrête dès qu'on y touche.
-->
<script>document.documentElement.classList.add('js')</script>
<style>
  /* Propriété typée : --reveal anime le balayage qui révèle l'interface à l'allumage de l'écran. */
  @property --reveal { syntax: "<percentage>"; inherits: true; initial-value: 100%; }

  :root {
    --k: calc(min(100vw, 100svh, 1620px) / 1080); /* px écran par px de maquette */
    --bg: #efefef;
    --screen: #dcdcdc;
    --ink: #000;
    --green: #03a26c;
    --out: cubic-bezier(.16, 1, .3, 1);        /* expo out */
    --spring: cubic-bezier(.34, 1.56, .64, 1); /* léger dépassement */
    --pct: 76;                                  /* niveau de batterie affiché (animé par le script) */
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { overflow: hidden; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
  .art { position: relative; flex: none; width: calc(1080 * var(--k)); height: calc(1080 * var(--k)); }
  .fill { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

  /* ---------- Boîtier ---------- */
  .device { position: absolute; inset: 0; }

  /* Écran : tout ce qui est dessus est en coordonnées de la maquette, relatives au coin (54, 649). */
  .screen {
    position: absolute;
    left: calc(54 * var(--k));
    top: calc(649 * var(--k));
    width: calc(958.2 * var(--k));
    height: calc(282.2 * var(--k));
    background: var(--screen);
    clip-path: url(#screen-clip);
    color: var(--ink);
    font-family: "Arimo UI", Arimo, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-kerning: normal;
    text-rendering: geometricPrecision;
    -webkit-font-smoothing: antialiased;
  }
  .screen::after { /* écran éteint : verre noir, puis allumage */
    content: "";
    position: absolute;
    inset: 0;
    z-index: 5;
    background: #0e0e0e;
    opacity: 0;
    pointer-events: none;
  }
  .content { position: absolute; inset: 0; clip-path: inset(0 0 calc(100% - var(--reveal)) 0); }
  .scan { /* front lumineux du balayage */
    position: absolute;
    left: 0;
    right: 0;
    z-index: 4;
    top: var(--reveal);
    height: calc(56 * var(--k));
    transform: translateY(-100%);
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, .7));
    opacity: 0;
    pointer-events: none;
  }

  /* Positionnement : --x, --y (boîte) ou --b (ligne de base) + --fs (corps) en px de maquette */
  .p { position: absolute; left: calc((var(--x) - 54) * var(--k)); top: calc((var(--y) - 649) * var(--k)); }
  .t {
    position: absolute;
    left: calc((var(--x) - 54) * var(--k));
    top: calc((var(--b) - 649 - .8465 * var(--fs)) * var(--k));
    font-size: calc(var(--fs) * var(--k));
    line-height: 1;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* Barre de batterie : piste, remplissage vert et halo, légèrement inclinés comme le boîtier */
  .bar {
    position: absolute;
    left: 0;
    top: calc(-3 * var(--k));
    width: 100%;
    height: calc(23.9 * var(--k));
    transform: rotate(-.109deg);
    transform-origin: calc(16 * var(--k)) calc(23.6 * var(--k));
    background: #d4d4d4;
  }
  .bar__fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: calc(var(--pct) * 9.309 * var(--k));
    background: linear-gradient(90deg, var(--green) calc(100% - 2px), #248967);
  }
  .bar__fill::before { /* reflet qui traverse la barre de temps en temps */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .34) 50%, transparent 70%) 0 0 / 40% 100% no-repeat;
    background-position-x: -60%;
    animation: shimmer 6s ease-in-out 3.6s infinite;
  }
  .bar__fill::after { /* halo à l'extrémité et sous la barre */
    content: "";
    position: absolute;
    left: 100%;
    top: 0;
    width: calc(7 * var(--k));
    height: 100%;
    background: linear-gradient(90deg, #93d4be, rgba(147, 212, 190, 0));
  }
  .bar__glow {
    position: absolute;
    left: 0;
    top: 100%;
    height: calc(4.2 * var(--k));
    width: calc(var(--pct) * 9.309 * var(--k));
    background: linear-gradient(#a4ecd4, rgba(164, 236, 212, 0));
  }
  .bar { overflow: visible; }
  @keyframes shimmer { 0%, 55% { background-position-x: -60%; } 100% { background-position-x: 260%; } }

  /* En-tête */
  .bolt { position: absolute; left: calc(41.15 * var(--k)); top: calc(31.05 * var(--k)); width: calc(23 * var(--k)); height: calc(23 * var(--k)); }
  .num { font-weight: 480; }
  .soft { color: #2a2a2a; }
  .clock { font-weight: 500; }

  /* Pressions : chiffres + unité */
  .tire .u { font-size: .55em; margin-left: -.08em; color: #1c1c1c; }

  /* Voiture */
  .car { position: absolute; left: calc(40 * var(--k)); top: calc(127 * var(--k)); width: calc(225 * var(--k)); height: calc(100 * var(--k)); overflow: visible; }

  /* Titre : lettres masquées qui montent, sous-titre qui glisse */
  .title, .sub { margin: 0; font-weight: 400; }
  .title { font-weight: 450; letter-spacing: calc(1 * var(--k)); }
  .sub { color: #1c1c1c; letter-spacing: .005em; }
  .title { clip-path: inset(-.1em -.15em -.13em -.15em); height: 1em; width: calc(300 * var(--k)); }
  .w { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .c { display: inline-block; white-space: pre; }
  .w.is-in .c { animation: c-in .8s var(--out) calc(var(--d0, .12s) + var(--n) * 38ms) backwards; }
  .w.is-out { pointer-events: none; }
  .w.is-out .c { animation: c-out .42s cubic-bezier(.5, 0, .75, 0) calc(var(--n) * 16ms) forwards; }
  @keyframes c-in { from { transform: translateY(135%); } }
  @keyframes c-out { to { transform: translateY(-135%); } }
  .sub .w.is-in { animation: s-in .7s var(--out) calc(var(--d0, .12s) + .18s) backwards; }
  .sub .w.is-out { animation: s-out .3s ease-in forwards; }
  @keyframes s-in { from { opacity: 0; transform: translateY(calc(9 * var(--k))); } }
  @keyframes s-out { to { opacity: 0; transform: translateY(calc(-6 * var(--k))); } }
  .sub { height: 1em; width: calc(330 * var(--k)); font-weight: 400; }

  /* Sélecteur de rapport */
  .gear {
    position: absolute;
    left: calc((479.4 - 54) * var(--k));
    top: calc((868.5 - 649) * var(--k));
    width: calc(116 * var(--k));
    height: calc(29.5 * var(--k));
    border-radius: calc(14.75 * var(--k));
    background: #d8d8d8;
  }
  .gear__thumb {
    position: absolute;
    left: calc(2.4 * var(--k));
    top: calc(2.75 * var(--k));
    width: calc(24 * var(--k));
    height: calc(24 * var(--k));
    border-radius: 50%;
    background: #c0c0c0;
    transform: translateX(calc(var(--i, 0) * 29 * var(--k)));
    transition: transform .55s var(--spring);
  }
  .gear button {
    position: absolute;
    top: 0;
    width: calc(29 * var(--k));
    height: 100%;
    padding: calc(1.7 * var(--k)) 0 0;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--ink);
    font-family: inherit;
    font-size: calc(14 * var(--k));
    font-weight: 620;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .2s var(--out);
  }
  .gear button:hover { transform: scale(1.12); }
  .gear button:focus-visible { outline: calc(2 * var(--k)) solid var(--ink); outline-offset: calc(-3 * var(--k)); }
  .gear button:nth-of-type(1) { left: 0; }
  .gear button:nth-of-type(2) { left: calc(29 * var(--k)); }
  .gear button:nth-of-type(3) { left: calc(58 * var(--k)); }
  .gear button:nth-of-type(4) { left: calc(87 * var(--k)); }

  /* Météo / heure */
  .time {
    position: absolute;
    left: calc((848 - 54) * var(--k));
    top: calc((869 - 649) * var(--k));
    width: calc(126.5 * var(--k));
    height: calc(28 * var(--k));
    border: calc(1 * var(--k)) solid rgba(0, 0, 0, .045);
    border-radius: calc(7 * var(--k));
  }
  .colon { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- Intro ---------- */
  html.js:not(.is-ready) :is(.dash, .device) { visibility: hidden; animation: unhide 0s 3s forwards; } /* filet de sécurité si le JS échoue */
  @keyframes unhide { to { visibility: visible; } }
  .is-ready .dash { animation: fade .9s ease-out both; }
  .is-ready .device { animation: rise 1.2s var(--out) .1s both; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(calc(34 * var(--k))); opacity: 0; } }

  .is-ready .screen { animation: on 1s cubic-bezier(.45, 0, .2, 1) .85s both; }
  .is-ready .screen::after { animation: glass .6s ease-in-out .8s both; }
  .is-ready .scan { animation: sweep 1s linear .85s both; }
  @keyframes on { from { --reveal: 0%; } to { --reveal: 100%; } }
  @keyframes glass { from { opacity: 1; } to { opacity: 0; } }
  @keyframes sweep { 0% { opacity: 0; } 15%, 85% { opacity: 1; } 100% { opacity: 0; } }

  .is-ready .pop { animation: pop .8s var(--spring) var(--d, 1s) backwards; }
  @keyframes pop { from { opacity: 0; transform: translateY(calc(10 * var(--k))) scale(.94); } }
  .is-ready .rise { animation: up .9s var(--out) var(--d, 1s) backwards; }
  @keyframes up { from { opacity: 0; transform: translateY(calc(8 * var(--k))); } }
  .is-ready .thumb-in { animation: thumb .8s var(--spring) var(--d, 1.5s) backwards; }
  @keyframes thumb { from { opacity: 0; scale: .2; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .scan { display: none; }
  }
</style>

<script>
(() => {
  const html = document.documentElement;
  const screen = document.querySelector('.screen');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const gearEl = document.querySelector('.gear');
  const radios = [...gearEl.querySelectorAll('[role=radio]')];
  const titleEl = document.querySelector('.title');
  const subEl = document.querySelector('.sub');

  const STATES = {
    P: ['Welcome', 'Brake and shift R/D to start the car'],
    R: ['Reverse', 'Check your surroundings'],
    N: ['Neutral', 'Shift to R or D to drive'],
    D: ['Ready', 'Release the brake to drive'],
  };
  let gear = 'P';
  let run = 0;   // id de la démo en cours : l'incrémenter l'annule
  let idle = 0;

  const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));
  const expo = (t) => (t >= 1 ? 1 : 1 - 2 ** (-10 * t));

  // ---- Compteurs : barre de batterie, kilomètres, pourcentage, pressions
  function countUp() {
    const items = [...document.querySelectorAll('[data-count]')].map((el) => ({
      el, to: +el.dataset.count, dec: +(el.dataset.dec || 0), ms: +el.dataset.ms, delay: +el.dataset.delay,
    }));
    items.forEach((c) => { c.el.textContent = (0).toFixed(c.dec); });
    screen.style.setProperty('--pct', 0);
    const t0 = performance.now();
    (function frame(now) {
      let live = false;
      for (const c of items) {
        const t = (now - t0 - c.delay) / c.ms;
        if (t < 1) live = true;
        c.el.textContent = (c.to * expo(Math.max(0, t))).toFixed(c.dec);
        if (c.to === 76) screen.style.setProperty('--pct', 76 * expo(Math.max(0, t)));
      }
      if (live) requestAnimationFrame(frame);
    })(t0);
  }

  // ---- Titre / sous-titre : les lettres sortent par le haut, les nouvelles montent par le bas
  function setWord(host, text, first) {
    if (host === titleEl) host.setAttribute('aria-label', text); // le titre est lu d'un bloc, pas lettre par lettre
    if (first) host.textContent = ''; // remplace le texte statique (sans JS) par les lettres animées
    host.querySelectorAll('.w').forEach((old) => {
      old.setAttribute('aria-hidden', 'true');
      old.classList.remove('is-in'); old.classList.add('is-out');
      old.addEventListener('animationend', () => old.remove(), { once: true });
      if (still) old.remove();
    });
    const w = document.createElement('span');
    w.className = 'w is-in';
    if (host === titleEl) w.setAttribute('aria-hidden', 'true');
    if (first) w.style.setProperty('--d0', '1s');
    if (host === subEl) w.textContent = text;
    else [...text].forEach((ch, n) => { const c = document.createElement('span'); c.className = 'c'; c.style.setProperty('--n', n); c.textContent = ch; w.append(c); });
    host.append(w);
  }
  function setGear(g, first) {
    gear = g;
    gearEl.style.setProperty('--i', 'PRND'.indexOf(g));
    radios.forEach((r) => { const on = r.dataset.gear === g; r.setAttribute('aria-checked', on); r.tabIndex = on ? 0 : -1; });
    if (first || STATES[g][0] !== titleEl.getAttribute('aria-label')) { setWord(titleEl, STATES[g][0], first); setWord(subEl, STATES[g][1], first); }
  }

  // ---- Démo : P -> D -> N -> R -> P ... jusqu'à ce qu'on touche au sélecteur
  async function demo(id) {
    const plan = [['D', 2600], ['N', 1500], ['R', 1700], ['P', 3400]];
    for (;;) {
      for (const [g, hold] of plan) {
        if (id !== run) return;
        setGear(g);
        await sleep(hold);
      }
    }
  }
  function auto(delay) { const id = ++run; sleep(delay).then(() => { if (id === run) demo(id); }); }
  function takeOver(ms) { run++; clearTimeout(idle); if (!still) idle = setTimeout(() => auto(0), ms); }

  radios.forEach((r) => r.addEventListener('click', () => { takeOver(8000); setGear(r.dataset.gear); }));
  gearEl.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!d) return;
    e.preventDefault();
    const next = radios[(radios.findIndex((r) => r.dataset.gear === gear) + d + 4) % 4];
    takeOver(8000); setGear(next.dataset.gear); next.focus();
  });

  // ---- Démarrage : on attend la police, puis l'intro CSS, puis les compteurs et la démo
  const fontReady = Promise.race([
    Promise.allSettled([document.fonts.load('400 1em "Arimo UI"'), document.fonts.load('700 1em "Arimo UI"'), document.fonts.ready]),
    new Promise((ok) => setTimeout(ok, 2000)),
  ]);
  fontReady.then(() => requestAnimationFrame(() => {
    setGear('P', true);
    if (!still) countUp();
    html.classList.add('is-ready');
    if (!still) auto(4200);
  }));
})();
</script>
</body>
</html>
